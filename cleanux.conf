# cleanux configuration
# Copy to /etc/cleanux.conf and adjust to your needs

# ── Docker ────────────────────────────────────────────────────────────────────
DOCKER_BUILDER=true
DOCKER_CONTAINERS=true
DOCKER_IMAGES=true
DOCKER_VOLUMES=false      # opt-in: risky if containers are temporarily stopped

# ── Logs ──────────────────────────────────────────────────────────────────────
JOURNAL_KEEP_DAYS=14

# ── Package manager ───────────────────────────────────────────────────────────
APT_CLEAN=true
APT_AUTOREMOVE=false      # opt-in

# ── Dev caches ────────────────────────────────────────────────────────────────
NPM_CACHE=true
PIP_CACHE=true
CARGO_CACHE=false         # opt-in: slow to rebuild
GO_CACHE=false            # opt-in: slow to rebuild

# ── System ────────────────────────────────────────────────────────────────────
SNAP_REVISIONS=true
CORE_DUMPS=true
TMP_MAX_DAYS=7

# ── Desktop ───────────────────────────────────────────────────────────────────
THUMBNAIL_CACHE=false     # opt-in: desktop only

# ── Notifications ─────────────────────────────────────────────────────────────
WEBHOOK_URL=""            # Slack / Discord webhook URL
NOTIFY_EMAIL=""           # email address (requires mail command)

# ── Reports ───────────────────────────────────────────────────────────────────
HTML_REPORT=false
HTML_REPORT_PATH="/var/log/cleanux-report.html"

# ── Log ───────────────────────────────────────────────────────────────────────
LOG_FILE="/var/log/cleanux.log"
LOG_MAX_MB=10

# ── General ───────────────────────────────────────────────────────────────────
DISK_THRESHOLD=0          # only run if disk >= N% (0 = always)
ALL_USERS=false           # clean dev caches for all users in /home

# ── AI scan ───────────────────────────────────────────────────────────────────
AI_ENDPOINT=""            # OpenAI-compatible base URL
                          #   OpenAI  → https://api.openai.com/v1
                          #   Ollama  → http://localhost:11434/v1
AI_API_KEY=""             # API key — leave empty for local models
AI_MODEL=""               # e.g. gpt-4o-mini, llama3, mistral
