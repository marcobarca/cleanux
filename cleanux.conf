# cleanux configuration
# Copy to /etc/cleanux.conf and adjust to your needs

# Journal: how many days of logs to keep
JOURNAL_KEEP_DAYS=14

# Docker modules (true/false)
DOCKER_BUILDER=true       # build cache — safe, often huge
DOCKER_CONTAINERS=true    # stopped containers
DOCKER_IMAGES=true        # dangling/untagged images only
DOCKER_VOLUMES=false      # unused volumes — opt-in, enable only if you're sure

# Package manager
APT_CLEAN=true            # clear downloaded package cache
APT_AUTOREMOVE=false      # remove unused dependency packages — opt-in

# Only run cleanup if disk usage is >= this percentage (0 = always run)
DISK_THRESHOLD=0

# Log file path
LOG_FILE="/var/log/cleanux.log"
