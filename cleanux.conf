# cleanux configuration
# Copy to /etc/cleanux.conf and adjust to your needs

# ── Docker ────────────────────────────────────────────────────────────────────
DOCKER_BUILDER=true       # build cache — safe, often huge
DOCKER_CONTAINERS=true    # stopped containers
DOCKER_IMAGES=true        # dangling/untagged images only
DOCKER_VOLUMES=false      # unused volumes — opt-in, enable only if you're sure

# ── System logs ───────────────────────────────────────────────────────────────
JOURNAL_KEEP_DAYS=14      # keep last N days of journal logs

# ── Package manager ───────────────────────────────────────────────────────────
APT_CLEAN=true            # clear downloaded package cache
APT_AUTOREMOVE=false      # remove unused dependency packages — opt-in

# ── Dev caches ────────────────────────────────────────────────────────────────
NPM_CACHE=true            # npm / yarn / pnpm cache
PIP_CACHE=true            # pip wheel cache
CARGO_CACHE=false         # cargo registry cache — opt-in: slow to rebuild
GO_CACHE=false            # Go build cache — opt-in: slow to rebuild

# ── System ────────────────────────────────────────────────────────────────────
SNAP_REVISIONS=true       # remove disabled snap revisions
CORE_DUMPS=true           # remove /var/crash and core.* dump files
TMP_MAX_DAYS=7            # remove /tmp files older than N days (0 = skip)

# ── Desktop ───────────────────────────────────────────────────────────────────
THUMBNAIL_CACHE=false     # ~/.cache/thumbnails — opt-in: desktop only

# ── General ───────────────────────────────────────────────────────────────────
DISK_THRESHOLD=0          # only run if disk usage >= N% (0 = always run)
LOG_FILE="/var/log/cleanux.log"
