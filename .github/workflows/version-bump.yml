name: Version bump

on:
  push:
    branches: [main]

jobs:
  bump:
    # skip if already a bot commit or tagged release
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          current=$(grep '^readonly VERSION=' cleanux.sh | cut -d'"' -f2)
          IFS='.' read -r major minor patch <<< "$current"
          new="${major}.${minor}.$(( patch + 1 ))"
          sed -i "s/^readonly VERSION=\"${current}\"/readonly VERSION=\"${new}\"/" cleanux.sh
          sed -i "s/version-${current}-blue/version-${new}-blue/" README.md
          echo "new=${new}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cleanux.sh README.md
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} [skip ci]"
          git push
